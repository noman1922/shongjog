<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 24px -1px rgba(30, 41, 59, 0.08);
        }
        
        .input-glow:focus-within {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-slate-100">
<main class="w-full max-w-md mx-auto">
<!-- Login Card -->
<div class="bg-slate-800 rounded-xl p-stack-lg md:p-margin-desktop w-full relative overflow-hidden border border-slate-700 shadow-2xl">
<!-- Decorative secure element -->
<div class="absolute top-0 right-0 p-stack-md opacity-10">
<span class="material-symbols-outlined text-[64px] text-blue-500" data-icon="shield_lock" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Header -->
<div class="mb-stack-lg relative z-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-700/50 mb-stack-md text-blue-400 border border-slate-600">
<span class="material-symbols-outlined text-3xl" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-white">System Admin</h1>
<p class="font-body-md text-body-md text-slate-400 mt-stack-sm">Restricted Area. Secure authentication required.</p>
</div>
<!-- Form -->
<form class="space-y-stack-md relative z-10">
<!-- Admin ID Field -->
<div>
<label class="block font-label-md text-label-md text-slate-300 mb-stack-sm" for="adminId">Administrator ID</label>
<div class="relative input-glow rounded-lg transition-shadow">
<div class="absolute inset-y-0 left-0 pl-stack-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500" data-icon="terminal">terminal</span>
</div>
<input class="block w-full pl-10 pr-stack-sm py-stack-sm border-slate-600 bg-slate-900 rounded-lg font-body-md text-body-md text-white placeholder:text-slate-500 focus:ring-0 focus:border-blue-500 transition-colors" id="adminId" name="adminId" placeholder="SYS-ADMIN-ID" required="" type="text"/>
</div>
</div>
<!-- Security Key Field -->
<div>
<label class="block font-label-md text-label-md text-slate-300 mb-stack-sm" for="securityKey">Access Token</label>
<div class="relative input-glow rounded-lg transition-shadow">
<div class="absolute inset-y-0 left-0 pl-stack-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500" data-icon="key">key</span>
</div>
<input class="block w-full pl-10 pr-10 py-stack-sm border-slate-600 bg-slate-900 rounded-lg font-body-md text-body-md text-white placeholder:text-slate-500 focus:ring-0 focus:border-blue-500 transition-colors" id="securityKey" name="securityKey" placeholder="••••••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-stack-sm flex items-center text-slate-500 hover:text-slate-300 transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-sm">
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-label-md text-label-md py-stack-sm px-stack-md rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg shadow-blue-500/20" type="submit">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
                        Authenticate Session
                    </button>
</div>
</form>
<div class="mt-stack-lg border-t border-slate-700 pt-stack-sm text-center">
<p class="font-body-sm text-body-sm text-slate-500 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="warning">warning</span>
    Unauthorized access attempts are logged and monitored.
</p>
</div>
</div>
</main>
</body></html>
