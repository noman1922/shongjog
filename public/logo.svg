<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shongjog-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shongjog-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="128" height="128" rx="28" fill="#090d16" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Shongjog Interconnected Nodes Loop ("S" Shape Connection) -->
  <g filter="url(#glow)">
    <!-- Primary Connecting Path -->
    <path 
      d="M40,44 C40,32 54,26 66,32 C78,38 88,48 88,64 C88,80 74,96 58,96 C44,96 38,86 44,76 C48,68 62,64 74,60 C84,56 88,48 88,42" 
      fill="none" 
      stroke="url(#shongjog-grad-1)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Inner Accent Loop -->
    <path 
      d="M40,44 C40,54 52,60 64,64 C76,68 88,74 88,84 C88,96 74,102 62,96" 
      fill="none" 
      stroke="url(#shongjog-grad-2)" 
      stroke-width="8" 
      stroke-linecap="round"
    />

    <!-- Student Node -->
    <circle cx="40" cy="44" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <!-- Alumni Node -->
    <circle cx="88" cy="84" r="9" fill="#ffffff" stroke="#3b82f6" stroke-width="4" />
    <!-- Center Bridge Hub -->
    <circle cx="64" cy="64" r="4.5" fill="#60a5fa" />
  </g>
</svg>
